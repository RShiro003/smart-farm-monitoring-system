<script>
// 서버가 최초 렌더링할 때 현재 선택된 장치 ID를 주입한다.
// 이후 모든 fetch 요청은 이 값을 기준으로 device_id 쿼리를 자동으로 붙여,
// 전체 장치 보기와 특정 ESP32 장치 보기가 같은 JS 코드로 동작하게 한다.
const SELECTED_DEVICE_ID = {{ (current_device_id or '')|tojson }};

function apiUrl(path, values = {}) {
    // 대시보드의 현재값/평균/그래프/히스토리 API는 모두 device_id 필터를 지원한다.
    // 화면 상단에서 장치를 선택한 경우 여기서 공통으로 쿼리스트링을 조립한다.
    const params = new URLSearchParams(values);
    if (SELECTED_DEVICE_ID) params.set('device_id', SELECTED_DEVICE_ID);
    const query = params.toString();
    return query ? `${path}?${query}` : path;
}

const REQUESTS = {};

async function fetchJson(key, url) {
    if (REQUESTS[key]) REQUESTS[key].abort();
    const controller = new AbortController();
    REQUESTS[key] = controller;

    try {
        const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) {
            if (res.status === 401) openAuthModal();
            throw new Error(data?.error || `Request failed (${res.status})`);
        }
        return data;
    } catch (e) {
        if (e.name === 'AbortError') return undefined;
        throw e;
    } finally {
        if (REQUESTS[key] === controller) delete REQUESTS[key];
    }
}

// 임계값 입력 폼과 서버 API가 공유하는 필드 목록이다.
// 각 input id는 threshold_${field} 형태이므로, 목록 하나로 입력 조회/검증/채우기를 반복 처리한다.
const THRESHOLD_FIELDS = [
    'temperature_min',
    'temperature_max',
    'humidity_min',
    'humidity_max',
    'soil_moisture_min',
    'soil_moisture_max',
    'light_min',
    'light_max',
    'soil_dry_raw',
    'soil_wet_raw',
];

const SOIL_CALIBRATION_FIELDS = ['soil_dry_raw', 'soil_wet_raw'];

// 최소/최대 쌍을 비교하기 위한 목록이다.
// 브라우저에서 먼저 잘못된 입력을 잡아주면 서버 왕복 없이 사용자에게 즉시 오류를 보여줄 수 있다.
const THRESHOLD_PAIRS = [
    ['temperature_min', 'temperature_max', '온도'],
    ['humidity_min', 'humidity_max', '습도'],
    ['soil_moisture_min', 'soil_moisture_max', '토양수분'],
    ['light_min', 'light_max', '조도'],
];

function thresholdInput(field) {
    return document.getElementById(`threshold_${field}`);
}

function setThresholdMessage(text, kind = '') {
    // 임계값 패널 하단의 상태 메시지를 통일된 방식으로 갱신한다.
    // kind는 ok/error 같은 표시 스타일을 붙이기 위한 값이다.
    const el = document.getElementById('threshold-message');
    if (!el) return;
    el.textContent = text;
    el.className = `threshold-message${kind ? ` ${kind}` : ''}`;
}

function setThresholdFormDisabled(disabled) {
    // 전체 장치 보기에서는 어떤 device_id에 임계값을 저장할지 모호하므로 폼을 비활성화한다.
    // 특정 장치를 선택한 뒤에만 해당 ESP32의 기준값을 조회/저장할 수 있다.
    for (const field of THRESHOLD_FIELDS) {
        const input = thresholdInput(field);
        if (input) input.disabled = disabled;
    }
    const saveBtn = document.getElementById('threshold-save-btn');
    if (saveBtn) saveBtn.disabled = disabled;
    updateSoilCalibrationButtons(disabled);
}

function currentSoilRaw() {
    const value = _lastSensorData?.soil_raw;
    const number = Number(value);
    return value == null || !Number.isInteger(number) ? null : number;
}

function updateSoilCalibrationButtons(formDisabled = !SELECTED_DEVICE_ID) {
    const disabled = formDisabled || currentSoilRaw() === null;
    for (const id of ['use-soil-dry-raw-btn', 'use-soil-wet-raw-btn']) {
        const button = document.getElementById(id);
        if (button) button.disabled = disabled;
    }
}

function useCurrentSoilRaw(field) {
    const raw = currentSoilRaw();
    if (raw === null) {
        setThresholdMessage('현재 원시값이 없습니다.', 'error');
        return;
    }
    const input = thresholdInput(field);
    if (input) input.value = raw;
    setThresholdMessage('현재 원시값을 입력했습니다. 저장 버튼을 눌러 적용하세요.');
}

function fillThresholdInputs(data) {
    // 장치별 임계값(ESP32 LED 판단 기준)을 입력창에 채운다.
    // 가이드 범위 표시는 작물 프로필 기준을 따르므로 BASIL은 건드리지 않는다.
    for (const field of THRESHOLD_FIELDS) {
        const input = thresholdInput(field);
        if (input) input.value = data[field] ?? '';
    }
}

async function loadThresholds(deviceId) {
    // 대시보드 로딩 시 현재 장치의 임계값을 서버에서 가져온다.
    // 서버는 장치 row가 없으면 기본값 row를 생성하므로, 브라우저는 항상 완성된 설정값을 받는다.
    const selectedDeviceId = (deviceId || '').trim();
    if (!selectedDeviceId) {
        setThresholdFormDisabled(true);
        setThresholdMessage('임계값을 설정하려면 장치를 선택하세요.');
        return;
    }

    setThresholdFormDisabled(false);
    setThresholdMessage('임계값을 불러오는 중...');

    try {
        const res = await fetch(`/api/thresholds?device_id=${encodeURIComponent(selectedDeviceId)}`);
        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error || '임계값을 불러오지 못했습니다.');
        }

        fillThresholdInputs(data);
        _savedThresholds = data;
        updateThresholdSyncNote();
        setThresholdMessage('현재 저장된 임계값을 불러왔습니다.', 'ok');
    } catch (e) {
        console.error('Threshold load failed:', e);
        setThresholdMessage(e.message || '임계값을 불러오지 못했습니다.', 'error');
    }
}

// ── 작물 권장 범위 ↔ 장치 임계값 동기화 ──────────────────
// 대시보드 가이드/차트 기준선은 "작물 권장 범위"를, ESP32 LED와 Discord 알림은
// "장치 임계값"을 사용한다. 둘은 서로 다른 테이블의 값이라 어긋날 수 있는데,
// 예전에는 그 사실이 화면에 전혀 드러나지 않아 작물만 바꾸고 기준이 바뀌었다고
// 오해하기 쉬웠다. 아래 두 함수가 그 차이를 드러내고 좁힌다.

// 임계값 필드명과 작물 프로필 필드명이 같으므로 그대로 비교한다.
const CROP_THRESHOLD_FIELDS = [
    'temperature_min', 'temperature_max',
    'humidity_min', 'humidity_max',
    'soil_moisture_min', 'soil_moisture_max',
    'light_min', 'light_max',
];

function updateThresholdSyncNote() {
    const el = document.getElementById('threshold-sync-note');
    const btn = document.getElementById('crop-apply-btn');
    if (!el) return;

    if (!SELECTED_DEVICE_ID) {
        el.textContent = '';
        el.className = 'threshold-sync';
        if (btn) btn.disabled = true;
        return;
    }
    if (btn) btn.disabled = false;

    if (!_activeCrop || !_savedThresholds) {
        el.textContent = '';
        el.className = 'threshold-sync';
        return;
    }

    const differing = CROP_THRESHOLD_FIELDS.filter(
        field => Number(_activeCrop[field]) !== Number(_savedThresholds[field])
    );

    if (differing.length === 0) {
        el.textContent = `✓ 임계값이 '${_activeCrop.name}' 권장 범위와 일치합니다.`;
        el.className = 'threshold-sync same';
        return;
    }

    // 조도만 다른 경우는 디지털 조도 센서라 의도적으로 다를 수 있어 문구를 구분한다.
    const onlyLight = differing.every(field => field.startsWith('light_'));
    el.textContent = onlyLight
        ? `⚠ 조도 기준이 '${_activeCrop.name}' 권장 범위와 다릅니다. 디지털 조도 센서면 정상입니다.`
        : `⚠ 현재 임계값이 '${_activeCrop.name}' 권장 범위와 다릅니다. ESP32는 위 임계값으로 판단합니다.`;
    el.className = 'threshold-sync diff';
}

async function applyCropThresholds() {
    // 선택된 작물의 권장 범위를 서버에서 그대로 임계값 테이블에 복사한다.
    // 브라우저에서 입력창만 채우고 끝내지 않고 서버 API를 쓰는 이유는,
    // 저장이 한 번에 확정되어야 ESP32가 다음 조회에서 반드시 같은 값을 받기 때문이다.
    if (!SELECTED_DEVICE_ID) {
        setThresholdMessage('장치를 먼저 선택하세요.', 'error');
        return;
    }
    if (!_activeCrop) {
        setThresholdMessage('작물을 먼저 선택하세요.', 'error');
        return;
    }
    if (!confirm(`'${_activeCrop.name}'의 권장 범위를 ${SELECTED_DEVICE_ID}의 임계값으로 저장할까요?\n\nESP32의 LED 판단과 Discord 알림 기준이 함께 바뀝니다.`)) {
        return;
    }

    const btn = document.getElementById('crop-apply-btn');
    if (btn) btn.disabled = true;
    setThresholdMessage('작물 기준을 적용하는 중...');

    try {
        const res = await fetch('/api/thresholds/from-crop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ device_id: SELECTED_DEVICE_ID, crop_id: _activeCrop.id }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '작물 기준 적용에 실패했습니다.');

        fillThresholdInputs(data.thresholds);
        _savedThresholds = data.thresholds;
        updateThresholdSyncNote();

        setThresholdMessage(
            data.light_unit_mismatch
                ? '적용했습니다. 디지털 조도는 lux와 비교하지 않도록 안전 범위(0~1)를 사용합니다.'
                : '작물 기준을 임계값으로 저장했습니다.',
            data.light_unit_mismatch ? '' : 'ok',
        );
    } catch (e) {
        console.error('Apply crop thresholds failed:', e);
        setThresholdMessage(e.message || '작물 기준 적용에 실패했습니다.', 'error');
    } finally {
        if (btn) btn.disabled = false;
    }
}

function validateThresholdInputs() {
    // 저장 버튼을 눌렀을 때 브라우저에서 먼저 숫자 여부와 min <= max 규칙을 확인한다.
    // 서버도 같은 검증을 하지만, 여기서 걸러주면 사용자에게 더 빠르게 오류를 보여줄 수 있다.
    const values = {};
    const errors = [];

    for (const field of THRESHOLD_FIELDS) {
        const input = thresholdInput(field);
        const raw = input ? input.value.trim() : '';
        const value = Number(raw);

        if (raw === '' || Number.isNaN(value)) {
            errors.push(`${field} 값은 숫자로 입력하세요.`);
            continue;
        }

        values[field] = value;
    }

    for (const [minField, maxField, label] of THRESHOLD_PAIRS) {
        if (values[minField] != null && values[maxField] != null && values[minField] > values[maxField]) {
            errors.push(`${label} 최소값은 최대값보다 클 수 없습니다.`);
        }
    }

    for (const field of SOIL_CALIBRATION_FIELDS) {
        if (values[field] != null && (!Number.isInteger(values[field]) || values[field] < 0 || values[field] > 4095)) {
            errors.push(`${field} 값은 0~4095 범위의 정수여야 합니다.`);
        }
    }
    if (values.soil_dry_raw != null && values.soil_wet_raw != null && values.soil_dry_raw <= values.soil_wet_raw) {
        errors.push('마른 흙 기준 원시값은 젖은 흙 기준 원시값보다 커야 합니다.');
    }

    return { ok: errors.length === 0, values, errors };
}

function serverThresholdError(data) {
    // 서버 검증 실패 응답의 details 객체를 사람이 읽을 수 있는 한 줄 메시지로 변환한다.
    if (!data?.details) return data?.error || '임계값 저장에 실패했습니다.';
    return Object.entries(data.details)
        .map(([field, message]) => `${field}: ${message}`)
        .join(', ');
}

async function saveThresholds(deviceId) {
    // 임계값 저장 흐름:
    // 1) 현재 선택된 device_id 확인
    // 2) 입력값 검증
    // 3) /api/thresholds PUT 호출
    // 4) 서버가 저장한 최종 값을 다시 입력창과 가이드에 반영
    const selectedDeviceId = (deviceId || '').trim();
    if (!selectedDeviceId) {
        setThresholdMessage('장치를 먼저 선택하세요.', 'error');
        return;
    }

    const result = validateThresholdInputs();
    if (!result.ok) {
        setThresholdMessage(result.errors[0], 'error');
        return;
    }

    const payload = { device_id: selectedDeviceId, ...result.values };
    const saveBtn = document.getElementById('threshold-save-btn');
    if (saveBtn) saveBtn.disabled = true;
    setThresholdMessage('저장 중...');

    try {
        const res = await fetch('/api/thresholds', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
            throw new Error(serverThresholdError(data));
        }

        fillThresholdInputs(data);
        _savedThresholds = data;
        updateThresholdSyncNote();
        setThresholdMessage('임계값이 저장되었습니다.', 'ok');
    } catch (e) {
        console.error('Threshold save failed:', e);
        setThresholdMessage(e.message || '임계값 저장에 실패했습니다.', 'error');
    } finally {
        if (saveBtn) saveBtn.disabled = false;
    }
}

// ── State ────────────────────────────────────────────────
let currentAvgPeriod   = 'daily';
let currentChartPeriod = 'hourly';
let _allCrops          = [];   // 서버에서 받은 전체 작물 목록
let _activeCrop        = null; // 현재 패널에 표시 중인 작물
let _lastSensorData    = null; // 작물 변경 시 패널 즉시 갱신에 사용
let _savedThresholds   = null; // 서버에 저장된 장치 임계값(작물 권장 범위와 비교용)
let _lightUnit         = null; // 최신 row의 조도 단위. lux인지 digital인지에 따라 표시가 달라진다.

// ── Basil reference data ─────────────────────────────────
// 우측 재배 가이드와 상태 배지는 이 기준값으로 현재 센서값을 판단한다.
// 이 값은 선택된 작물 프로필에서 오며(applyCropToPanel), 장치 임계값과는 별개다.
// 둘이 어긋났는지는 updateThresholdSyncNote()가 임계값 패널에 표시한다.
const BASIL = {
    temperature:   { min: 18,   max: 27,   scaleMax: 40,    unit: '°C'  },
    humidity:      { min: 40,   max: 70,   scaleMax: 100,   unit: '%'   },
    soil_moisture: { min: 50,   max: 70,   scaleMax: 100,   unit: '%'   },
    light:         { min: 2000, max: 8000, scaleMax: 12000, unit: 'lux' },
};

// ── 조도 단위 처리 ────────────────────────────────────────
// light 컬럼에는 조도계의 lux 값이 들어올 수도, LM393류 비교기의 0/1이 들어올 수도 있다.
// 두 값을 같은 방식으로 표시하면 "3,000 lux"와 "1 lux"가 나란히 놓여 오해를 부른다.
// 서버가 함께 내려주는 light_unit으로 표시 방법을 나눈다.
const LIGHT_UNIT_DIGITAL = 'digital';

function isDigitalLight() {
    return _lightUnit === LIGHT_UNIT_DIGITAL;
}

function formatLightValue(raw) {
    // 디지털 센서는 숫자 자체에 밝기 의미가 없다.
    // 모듈에 따라 극성이 반대인 경우가 있어 원시값은 카드 하단에 따로 남긴다.
    if (raw == null || raw === '—') return '—';
    if (!isDigitalLight()) return raw;
    const n = Number(raw);
    if (!Number.isFinite(n)) return raw;
    return n === 0 ? '밝음' : '어두움';
}

function updateLightUnitDisplay() {
    const digital = isDigitalLight();

    const unitEl = document.getElementById('live-light-unit');
    if (unitEl) unitEl.textContent = digital ? '' : 'lux';

    const noteEl = document.getElementById('live-light-note');
    if (noteEl) {
        const raw = _lastSensorData?.light ?? _lastSensorData?.light_digital;
        noteEl.textContent = digital ? `디지털 조도 센서 (원시값 ${raw ?? '—'})` : '';
    }

    // 가이드 패널의 조도 단위 표기도 함께 맞춘다.
    BASIL.light.unit = digital ? '' : 'lux';
}

function formatGuideNumber(value) {
    // 적정 범위 표시에서 2000을 2,000처럼 읽기 좋게 보여주고,
    // 소수값은 필요한 범위에서만 표시한다.
    const n = Number(value);
    if (!Number.isFinite(n)) return value;
    return Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}

function updateGuideRangeVisual(key) {
    // 적정 범위 숫자와 막대의 초록 구간 위치를 같이 갱신한다.
    // scaleMax는 막대 전체 폭의 기준값이고, min/max는 그 안에서 적정 구간의 시작/폭이 된다.
    const { min, max, scaleMax, unit } = BASIL[key];
    const range = document.getElementById(`grange-${key}`);
    if (range) range.textContent = `${formatGuideNumber(min)} – ${formatGuideNumber(max)} ${unit}`;

    const zone = document.getElementById(`gzone-${key}`);
    if (zone) {
        zone.style.left = `${(min / scaleMax * 100).toFixed(1)}%`;
        zone.style.width = `${((max - min) / scaleMax * 100).toFixed(1)}%`;
    }
}

function basilStatus(key, raw) {
    // 현재 센서값을 적정/주의/위험 세 단계로 분류한다.
    // 적정 범위 안이면 OK, 범위에서 20% 정도 벗어난 값은 주의, 그 이상은 위험으로 표시한다.
    // 디지털 조도(0/1)는 lux 권장 범위와 비교할 수 없어 판정 대상에서 제외한다.
    if (key === 'light' && isDigitalLight()) {
        return { text: '측정 방식 다름', cls: 'status-unknown' };
    }
    if (raw == null || raw === '—') return { text: '—', cls: 'status-unknown' };
    const v = parseFloat(raw);
    if (isNaN(v)) return { text: '—', cls: 'status-unknown' };
    const { min, max } = BASIL[key];
    if (v >= min && v <= max) return { text: '✓ 적정', cls: 'status-ok' };
    const slack = (max - min) * 0.2;
    if (v >= min - slack && v <= max + slack) return { text: '⚠ 주의', cls: 'status-warn' };
    return { text: '✗ 위험', cls: 'status-danger' };
}

function updateBasilPanel(d) {
    // 최신 센서 row를 우측 가이드 패널에 반영한다.
    // 숫자, 상태 배지, 적정 구간 막대, 현재값 점 위치를 한 번에 갱신해 화면 요소 간 기준이 어긋나지 않게 한다.
    const rawOf = {
        temperature:   d?.temperature,
        humidity:      d?.humidity,
        soil_moisture: d?.soil_moisture,
        light:         d?.light ?? d?.light_digital,
    };
    for (const key of Object.keys(BASIL)) {
        const raw = rawOf[key] ?? '—';
        const s = basilStatus(key, raw);

        const valEl = document.getElementById(`gval-${key}`);
        if (valEl) valEl.textContent = key === 'light' ? formatLightValue(raw) : raw;

        const sEl = document.getElementById(`gstatus-${key}`);
        if (sEl) { sEl.textContent = s.text; sEl.className = `status-badge ${s.cls}`; }

        const { min, max, scaleMax } = BASIL[key];
        const zone = document.getElementById(`gzone-${key}`);
        if (zone) {
            zone.style.left  = `${(min / scaleMax * 100).toFixed(1)}%`;
            zone.style.width = `${((max - min) / scaleMax * 100).toFixed(1)}%`;
        }

        // 디지털 조도는 막대 위 점 위치가 아무 의미도 갖지 않으므로 감춘다.
        const dot = document.getElementById(`gdot-${key}`);
        if (dot && key === 'light' && isDigitalLight()) {
            dot.style.display = 'none';
            continue;
        }
        if (dot && raw !== '—') {
            const v = parseFloat(raw);
            dot.style.left    = `${Math.max(0, Math.min(100, v / scaleMax * 100)).toFixed(1)}%`;
            dot.style.display = 'block';
            dot.style.background = s.cls === 'status-ok' ? '#4ade80'
                                 : s.cls === 'status-warn' ? '#fbbf24' : '#f87171';
        }
    }
}

// ── Prediction ────────────────────────────────────────────
// 각 주기별로 차트에 추가할 예측 포인트 수이다.
const PREDICT_COUNTS = { hourly: 6, daily: 3, weekly: 2, monthly: 2 };

function predictFuture(values, numFuture) {
    // 지수 가중 선형 회귀로 미래값을 예측한다.
    // 최신 포인트가 가장 오래된 포인트보다 e^2(≈7.4)배 높은 가중치를 받아
    // 최근 추세를 강하게 반영한다.
    const pts = values.map((v, i) => v != null ? [i, v] : null).filter(Boolean);
    if (pts.length < 2) {
        const flat = pts.length === 1 ? pts[0][1] : null;
        return Array(numFuture).fill(flat);
    }

    const n = pts.length;
    let sw = 0, swx = 0, swy = 0, swxy = 0, swx2 = 0;
    pts.forEach(([x, y], k) => {
        const w = Math.exp(2 * k / (n - 1));
        sw += w; swx += w * x; swy += w * y; swxy += w * x * y; swx2 += w * x * x;
    });

    const denom = sw * swx2 - swx * swx;
    if (Math.abs(denom) < 1e-10) {
        return Array(numFuture).fill(Math.round(pts[n - 1][1] * 10) / 10);
    }

    const slope     = (sw * swxy - swx * swy) / denom;
    const intercept = (swy - slope * swx) / sw;
    const lastX     = pts[n - 1][0];

    return Array.from({ length: numFuture }, (_, i) =>
        Math.round((intercept + slope * (lastX + i + 1)) * 10) / 10
    );
}

function getFutureLabels(period, count) {
    // 예측 구간 x축 레이블: "+1h", "+2일" 처럼 현재 시점 이후를 직관적으로 표현한다.
    const unit = { hourly: 'h', daily: '일', weekly: '주', monthly: '개월' }[period] ?? '';
    return Array.from({ length: count }, (_, i) => `+${i + 1}${unit}`);
}

function buildPredDataset(color, data) {
    // 예측 데이터셋은 같은 색상을 60% 투명도로 줄이고 점선으로 표시한다.

}

// ── Chart setup ──────────────────────────────────────────
Chart.defaults.color = '#64748b';
Chart.defaults.borderColor = '#1e293b';

function makeHLine(y, color, labelText) {
    // Chart.js annotation 플러그인으로 적정 최소/최대 기준선을 표시한다.
    // 사용자는 센서 추이가 기준값을 넘는 시점을 그래프에서 바로 확인할 수 있다.
    return {
        type: 'line',
        yMin: y, yMax: y,
        borderColor: color,
        borderWidth: 1.5,
        borderDash: [6, 4],
        label: {
            display: true,
            content: labelText,
            position: 'start',
            backgroundColor: color + '22',
            color: color,
            font: { size: 10, weight: '600' },
            padding: { x: 6, y: 3 },
            borderRadius: 4,
        }
    };
}

function makeChart(canvasId, color, annotations = {}) {
    // 네 개 센서 그래프가 같은 옵션을 공유하므로 생성 함수를 둔다.
    // 이후 loadCharts()는 labels와 dataset만 교체해 차트를 다시 그린다.
    const ctx = document.getElementById(canvasId).getContext('2d');
    return new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderColor: color,
                backgroundColor: color + '18',
                borderWidth: 2,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointBackgroundColor: color,
                tension: 0.35,
                fill: true,
                spanGaps: false,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 2.2,
            animation: { duration: 300 },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#0f172a',
                    titleColor: '#94a3b8',
                    bodyColor: '#f1f5f9',
                    borderColor: '#334155',
                    borderWidth: 1,
                    padding: 10,
                },
                annotation: { annotations }
            },
            scales: {
                x: {
                    grid: { color: '#1e293b' },
                    ticks: { color: '#475569', maxRotation: 45, font: { size: 10 } },
                },
                y: {
                    grid: { color: '#1e293b' },
                    ticks: { color: '#475569', font: { size: 10 } },
                }
            }
        }
    });
}

}

function renderEmptyTable(tbodyId, colspan, message) {
    const tbody = document.getElementById(tbodyId);
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = colspan;
    cell.style.cssText = 'text-align:center;color:#475569;padding:28px;';

function appendTextCell(row, text, className = '') {

    row.appendChild(cell);
    return cell;
}

function renderGrowthRecords(records) {
    const tbody = document.getElementById('growth-tbody');
    if (!records.length) {
        renderEmptyTable('growth-tbody', 4, '등록된 생육 기록이 없습니다.');
        return;
    }

    const fragment = document.createDocumentFragment();
    for (const record of [...records].reverse().slice(0, 20)) {
        const row = document.createElement('tr');
        appendTextCell(row, record.recorded_at ?? '—');
        appendTextCell(
            row,
            record.height_cm == null ? '—' : `${record.height_cm} cm`,
            'soil-val',
        );
        appendTextCell(
            row,
            record.leaf_count == null ? '—' : `잎 ${record.leaf_count}개`,
        );
        appendTextCell(row, record.note ?? '—');
        fragment.appendChild(row);
    }
    tbody.replaceChildren(fragment);
}

function updateGrowthChart(records) {
    const measured = records.filter(record => Number.isFinite(Number(record.height_cm)));
    growthChart.data.labels = measured.map(record => (record.recorded_at ?? '').slice(0, 10));
    growthChart.data.datasets[0].data = measured.map(record => Number(record.height_cm));
    growthChart.update('active');
}

async function loadGrowth() {
    if (!SELECTED_DEVICE_ID) {
        setGrowthFormDisabled(true);
        setGrowthMessage('상단에서 기록할 장치를 선택하세요.');
        renderEmptyTable('growth-tbody', 4, '장치를 선택하면 생육 기록을 볼 수 있습니다.');
        updateGrowthChart([]);
        return;
    }

    setGrowthFormDisabled(growthSaving);
    try {
        const records = await fetchJson('growth', apiUrl('/api/growth'));
        if (records === undefined) return;
        const safeRecords = Array.isArray(records) ? records : [];
        renderGrowthRecords(safeRecords);
        updateGrowthChart(safeRecords);
    } catch (error) {
        console.error('Growth records load failed:', error);
        renderEmptyTable('growth-tbody', 4, '생육 기록을 불러오지 못했습니다.');
    }
}

async function submitGrowthRecord(event) {
    event.preventDefault();
    if (!SELECTED_DEVICE_ID) {
        setGrowthMessage('먼저 장치를 선택하세요.', 'error');
        return;
    }
    if (growthSaving) return;

    const heightRaw = document.getElementById('growth-height').value.trim();
    const leafRaw = document.getElementById('growth-leaf-count').value.trim();
    const note = document.getElementById('growth-note').value.trim();
    const payload = { device_id: SELECTED_DEVICE_ID, note };

    if (heightRaw) {
        const height = Number(heightRaw);
        if (!Number.isFinite(height) || height < 0) {
            setGrowthMessage('바질 키는 0 이상의 숫자여야 합니다.', 'error');
            return;
        }
        payload.height_cm = height;
    }
    if (leafRaw) {
        const leafCount = Number(leafRaw);
        if (!Number.isInteger(leafCount) || leafCount < 0) {
            setGrowthMessage('잎 개수는 0 이상의 정수여야 합니다.', 'error');
            return;
        }
        payload.leaf_count = leafCount;
    }

    growthSaving = true;
    setGrowthFormDisabled(true);
    setGrowthMessage('저장 중…');
    try {
        const response = await fetch('/api/growth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '생육 기록 저장 실패');

        document.getElementById('growth-form').reset();
        setGrowthMessage('저장했습니다.', 'ok');
        await loadGrowth();
    } catch (error) {
        setGrowthMessage(error.message || '생육 기록 저장에 실패했습니다.', 'error');
    } finally {
        growthSaving = false;
        setGrowthFormDisabled(false);
    }
}

async function saveWorkLog() {
    if (!SELECTED_DEVICE_ID) {
        setWorkLogMessage('먼저 장치를 선택하세요.', 'error');
        return;
    }
    const occurred = document.getElementById('work-log-time')?.value || null;
    const payload = {
        device_id: SELECTED_DEVICE_ID,
        work_type: document.getElementById('work-log-type')?.value,
        note: document.getElementById('work-log-note')?.value ?? '',
        occurred_at: occurred,
    };
    setWorkLogMessage('저장 중...');
    try {
        const response = await fetch('/api/work-logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),

async function deleteWorkLog(id) {
    if (!confirm('이 작업 기록을 삭제할까요?')) return;
    const response = await fetch(`/api/work-logs/${id}`, { method: 'DELETE' });
    if (!response.ok) {
        setWorkLogMessage('작업 기록을 삭제하지 못했습니다.', 'error');
        return;
    }
    setWorkLogMessage('작업 기록을 삭제했습니다.', 'ok');
    await loadWorkLogs();
}

function workLogChartLabel(item, period) {
    const date = new Date(String(item.occurred_at).replace(' ', 'T'));
    if (Number.isNaN(date.getTime())) return null;
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const hh = String(date.getHours()).padStart(2, '0');
    if (period === 'hourly') return `${mm}/${dd} ${hh}:00`;
    if (period === 'daily') return `${mm}/${dd}`;
    if (period === 'weekly') {
        const monday = new Date(date);
        monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
        return `${String(monday.getMonth() + 1).padStart(2, '0')}/${String(monday.getDate()).padStart(2, '0')}~`;
    }
    return `${date.getFullYear()}/${mm}`;
}

function makeWorkAnnotations(labels) {

    return annotations;
}

function updateChartAnnotations() {
    // BASIL 기준값이 바뀔 때마다 네 개 차트의 min/max 기준선을 다시 그린다.
    const setAnn = (chart, min, max, unit) => {
        chart.options.plugins.annotation.annotations = {
            minRef: makeHLine(min, '#4ade80', `최소 ${formatGuideNumber(min)}${unit}`),
            maxRef: makeHLine(max, '#f97316', `최대 ${formatGuideNumber(max)}${unit}`),
            ...makeWorkAnnotations(chart.data.labels),
        };
        chart.update('none');
    };
    setAnn(charts.temp,  BASIL.temperature.min,   BASIL.temperature.max,   BASIL.temperature.unit);
    setAnn(charts.hum,   BASIL.humidity.min,      BASIL.humidity.max,      BASIL.humidity.unit);
    setAnn(charts.soil,  BASIL.soil_moisture.min, BASIL.soil_moisture.max, BASIL.soil_moisture.unit);
    setAnn(charts.light, BASIL.light.min,         BASIL.light.max,         BASIL.light.unit);
}

function applyCropToPanel(crop) {
    // 선택된 작물 데이터를 BASIL 기준값, 가이드 범위 표시, 재배 팁, 차트 기준선에 반영한다.
    if (!crop) return;
    _activeCrop = crop;

    BASIL.temperature.min   = crop.temperature_min;
    BASIL.temperature.max   = crop.temperature_max;
    BASIL.temperature.scaleMax = Math.max(40, crop.temperature_max + 5);

    BASIL.humidity.min      = crop.humidity_min;
    BASIL.humidity.max      = crop.humidity_max;
    BASIL.humidity.scaleMax = 100;

    BASIL.soil_moisture.min = crop.soil_moisture_min;
    BASIL.soil_moisture.max = crop.soil_moisture_max;
    BASIL.soil_moisture.scaleMax = 100;

    BASIL.light.min         = crop.light_min;
    BASIL.light.max         = crop.light_max;
    BASIL.light.scaleMax    = Math.max(12000, Math.ceil(crop.light_max * 1.25));

    for (const key of Object.keys(BASIL)) updateGuideRangeVisual(key);
    updateGuideNotes(crop.notes || []);
    updateChartAnnotations();
    if (_lastSensorData !== null) updateBasilPanel(_lastSensorData);
    // 작물이 바뀌면 저장된 임계값과의 일치 여부도 다시 판단해야 한다.
    updateThresholdSyncNote();
}

function renderCropSelect(crops) {
    const sel = document.getElementById('crop-panel-select');
    if (!sel) return;
    sel.textContent = '';
    for (const crop of crops) {
        const option = document.createElement('option');
        option.value = String(crop.id);
        option.textContent = crop.name;
        sel.appendChild(option);
    }
}

async function loadActiveCrop() {
    // 전체 작물 목록과 현재 장치에 할당된 작물을 병렬로 불러온다.
    try {
        const cropsRes = await fetch('/api/crops');
        _allCrops = await cropsRes.json();
        renderCropSelect(_allCrops);

        let activeCrop;
        if (SELECTED_DEVICE_ID) {
            const res = await fetch(`/api/crops/device?device_id=${encodeURIComponent(SELECTED_DEVICE_ID)}`);
            activeCrop = await res.json();
        } else {
            activeCrop = _allCrops[0] || null;
        }

        if (activeCrop) {
            applyCropToPanel(activeCrop);
            const sel = document.getElementById('crop-panel-select');
            if (sel) sel.value = activeCrop.id;
        }
    } catch (e) {
        console.error('Load active crop failed:', e);
    }
}

async function onCropSelectChange(cropIdStr) {
    // 패널 드롭다운에서 작물을 바꿀 때 호출된다.
    // 장치가 선택된 경우 서버에 device→crop 매핑도 저장한다.
    const cropId = Number(cropIdStr);
    const crop = _allCrops.find(c => c.id === cropId);
    if (!crop) return;

    applyCropToPanel(crop);
    const sel = document.getElementById('crop-panel-select');
    if (sel) sel.value = cropId;

    if (SELECTED_DEVICE_ID) {
        try {
            await fetch('/api/crops/device', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: SELECTED_DEVICE_ID, crop_id: cropId }),
            });
        } catch (e) {
            console.error('Save device crop failed:', e);
        }
    }
}

function closeCropModal() {

function renderModalCropList(crops) {

function showCropForm(cropId) {
    document.getElementById('crop-modal-list-view').style.display = 'none';
    document.getElementById('crop-modal-edit-view').style.display = '';
    document.getElementById('crop-form-id').value = cropId || '';
    document.getElementById('crop-form-title').textContent = cropId ? '작물 수정' : '새 작물 추가';
    document.getElementById('crop-form-msg').textContent = '';
    document.getElementById('crop-form-msg').className = 'modal-msg';

    const crop = cropId ? _allCrops.find(c => c.id === cropId) : null;
    const v = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
    v('crop-form-name',              crop?.name ?? '');
    v('crop-form-temperature-min',   crop?.temperature_min ?? '');
    v('crop-form-temperature-max',   crop?.temperature_max ?? '');
    v('crop-form-humidity-min',      crop?.humidity_min ?? '');
    v('crop-form-humidity-max',      crop?.humidity_max ?? '');
    v('crop-form-soil-moisture-min', crop?.soil_moisture_min ?? '');
    v('crop-form-soil-moisture-max', crop?.soil_moisture_max ?? '');
    v('crop-form-light-min',         crop?.light_min ?? '');
    v('crop-form-light-max',         crop?.light_max ?? '');
    const notesEl = document.getElementById('crop-form-notes');
    if (notesEl) notesEl.value = (crop?.notes || []).join('\n');
}

async function submitCropForm() {
    const cropId = document.getElementById('crop-form-id').value;
    const msgEl  = document.getElementById('crop-form-msg');

    const name = document.getElementById('crop-form-name').value.trim();
    if (!name) {
        msgEl.textContent = '작물명을 입력하세요.';
        msgEl.className   = 'modal-msg error';
        return;
    }

    const getNum = id => {
        const v = (document.getElementById(id)?.value ?? '').trim();
        return v === '' ? null : Number(v);
    };

    const payload = {
        name,
        temperature_min:   getNum('crop-form-temperature-min'),
        temperature_max:   getNum('crop-form-temperature-max'),
        humidity_min:      getNum('crop-form-humidity-min'),
        humidity_max:      getNum('crop-form-humidity-max'),
        soil_moisture_min: getNum('crop-form-soil-moisture-min'),
        soil_moisture_max: getNum('crop-form-soil-moisture-max'),
        light_min:         getNum('crop-form-light-min'),
        light_max:         getNum('crop-form-light-max'),
        notes: (document.getElementById('crop-form-notes')?.value ?? '')
            .split('\n').map(s => s.trim()).filter(Boolean),
    };

    // 클라이언트 측 간단 검증
    const labels = {
        temperature_min: '온도 최소', temperature_max: '온도 최대',
        humidity_min: '습도 최소',    humidity_max: '습도 최대',
        soil_moisture_min: '토양수분 최소', soil_moisture_max: '토양수분 최대',
        light_min: '조도 최소',       light_max: '조도 최대',
    };
    for (const [key, label] of Object.entries(labels)) {
        if (payload[key] === null || Number.isNaN(payload[key])) {
            msgEl.textContent = `${label}를 숫자로 입력하세요.`;
            msgEl.className   = 'modal-msg error';
            return;
        }
    }

    msgEl.textContent = '저장 중...';
    msgEl.className   = 'modal-msg';

    try {
        const url    = cropId ? `/api/crops/${cropId}` : '/api/crops';
        const method = cropId ? 'PUT' : 'POST';
        const res    = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '저장에 실패했습니다.');

        // 목록과 드롭다운 갱신
        const cropsRes = await fetch('/api/crops');
        _allCrops = await cropsRes.json();
        renderCropSelect(_allCrops);

        // 현재 활성 작물이 수정됐으면 패널에 즉시 반영
        if (_activeCrop && String(_activeCrop.id) === String(data.id)) {
            applyCropToPanel(data);
            const sel = document.getElementById('crop-panel-select');
            if (sel) sel.value = data.id;
        }

        msgEl.textContent = '저장되었습니다!';
        msgEl.className   = 'modal-msg ok';
        setTimeout(showCropList, 900);
    } catch (e) {
        msgEl.textContent = e.message || '저장에 실패했습니다.';
        msgEl.className   = 'modal-msg error';
    }
}

async function confirmDeleteCrop(cropId, cropName) {
    if (!confirm(`'${cropName}' 작물을 삭제하시겠습니까?`)) return;
    try {
        const res  = await fetch(`/api/crops/${cropId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) { alert(data.error || '삭제에 실패했습니다.'); return; }

        const cropsRes = await fetch('/api/crops');
        _allCrops = await cropsRes.json();
        renderCropSelect(_allCrops);

        // 삭제된 작물이 활성 상태였으면 첫 번째 작물로 전환
        if (_activeCrop && _activeCrop.id === cropId && _allCrops.length > 0) {
            await onCropSelectChange(_allCrops[0].id);
        }
        showCropList();
    } catch (e) {
        alert('삭제 중 오류가 발생했습니다.');
    }
}

// ── Chart data load ──────────────────────────────────────
async function loadCharts(period) {
    // 서버에서 period별로 집계된 labels와 평균 배열을 받아 Chart.js dataset에 반영한다.
    // 실제 데이터 뒤에 예측 포인트를 추가해 점선으로 미래 추세를 표시한다.
    const summary = document.getElementById('chart-period-summary');
    if (summary && period === currentChartPeriod) {
        summary.textContent = `${CHART_PERIOD_LABELS[period]} · 불러오는 중…`;
    }
    try {
        const data = await fetchJson('chart', apiUrl('/api/dashboard/chart', { period }));
        if (data === undefined) return;
        // 직전 요청이 네트워크에서 이미 완료된 뒤 다른 버튼을 누르면 abort만으로는
        // 늦게 이어지는 화면 갱신을 막지 못한다. 현재 선택 및 서버 적용 기간이 모두
        // 일치할 때만 차트를 교체해 버튼과 그래프가 서로 다른 상태를 방지한다.
        if (period !== currentChartPeriod || data.period !== period) return;
        const numPred = PREDICT_COUNTS[period] ?? 3;

        if (summary) {
            const samples = Number(data.sample_count ?? 0).toLocaleString();
            summary.textContent = `${CHART_PERIOD_LABELS[period]} · ${data.bucket_count ?? 0}개 구간 · ${samples}건`;
        }

        const lightTitle = document.getElementById('light-chart-title');
        if (lightTitle) {
            lightTitle.textContent = data.light_mode === 'mixed'
                ? '조도 (lux 장치만 · 디지털 제외)'
                : data.light_mode === 'digital'
                    ? '조도 (디지털 센서 · lux 차트 없음)'
                    : '조도 (lux)';
        }

        for (const [name, key] of CHART_KEYS) {
            const values      = data[key]    ?? [];
            const labels      = data.labels  ?? [];
            const predicted   = predictFuture(values, numPred);
            const futureLabels = getFutureLabels(period, numPred);

            // 예측 데이터셋: 실제 구간은 null로 채우고 마지막 실제값에서 연결한다.
            const lastActual = [...values].reverse().find(v => v != null) ?? null;
            const predData   = values.length > 0
                ? [...Array(values.length - 1).fill(null), lastActual, ...predicted]
                : [];

            charts[name].data.labels           = [...labels, ...futureLabels];
            charts[name].data.datasets[0].data = [...values, ...Array(numPred).fill(null)];

            // 두 번째 데이터셋(예측)이 없으면 추가, 있으면 데이터만 교체한다.
            if (charts[name].data.datasets.length < 2) {
                const color = charts[name].data.datasets[0].borderColor;
                charts[name].data.datasets.push(buildPredDataset(color, predData));
            } else {
                charts[name].data.datasets[1].data = predData;
            }

            charts[name].update('active');
        }
        // 새 x축 레이블을 기준으로 작업 기록 세로선을 다시 배치한다.
        updateChartAnnotations();
    } catch (e) {
        console.error('Chart load failed:', e);
        if (summary && period === currentChartPeriod) {
            summary.textContent = `${CHART_PERIOD_LABELS[period]} · 불러오기 실패`;
        }
    }
}

function setChartPeriod(period, btn) {
    // 시간별/일간/주간/월간 버튼 상태를 갱신하고 같은 period 값으로 차트 API를 다시 호출한다.
    currentChartPeriod = period;

}

const AVG_PERIOD_LABELS = { daily: '지난 24시간', weekly: '지난 7일', monthly: '지난 30일' };
const AVG_PERIOD_NAMES = { daily: '일간', weekly: '주간', monthly: '월간' };
const CHART_PERIOD_LABELS = {
    hourly: '시간별 · 최근 24시간',
    daily: '일간 · 최근 7일',
    weekly: '주간 · 최근 8주',
    monthly: '월간 · 최근 12개월',
};

async function loadAverages(period) {
    // 기간별 평균 카드는 /api/dashboard/stats 응답만 사용한다.
    // 서버가 count도 함께 반환하므로 평균이 몇 건의 데이터로 계산됐는지 보조 문구에 표시할 수 있다.
    const summary = document.getElementById('avg-period-summary');
    if (summary && period === currentAvgPeriod) {
        summary.textContent = `${AVG_PERIOD_NAMES[period]} · ${AVG_PERIOD_LABELS[period]} · 불러오는 중…`;
    }
    try {
        const d = await fetchJson('stats', apiUrl('/api/dashboard/stats', { period }));
        if (d === undefined) return;
        if (period !== currentAvgPeriod || d.period !== period) return;

        document.getElementById('avg-temp').textContent  = d.temperature   ?? '—';
        document.getElementById('avg-hum').textContent   = d.humidity      ?? '—';
        document.getElementById('avg-soil').textContent  = d.soil_moisture ?? '—';
        document.getElementById('avg-light').textContent = d.light         ?? '—';

        const lightUnit = document.getElementById('avg-light-unit');
        const lightSub = document.getElementById('avg-light-sub');
        if (lightUnit) lightUnit.textContent = d.light == null ? '' : 'lux';
        if (lightSub) {
            if (d.light_mode === 'mixed') {
                lightSub.textContent = `lux ${d.light_count}건만 집계 · 디지털 ${d.digital_light_count}건 제외`;
            } else if (d.light_mode === 'digital') {
                lightSub.textContent = `디지털 조도 ${d.digital_light_count}건 · 평균 미제공`;
            } else {
                lightSub.textContent = d.light_count ? `lux ${d.light_count}건` : '';
            }
        }

        const sub = document.getElementById('avg-temp-sub');
        if (sub) sub.textContent = `${AVG_PERIOD_LABELS[period] ?? period} · ${d.count}건`;
        if (summary) {
            summary.textContent = `${AVG_PERIOD_NAMES[period]} · ${AVG_PERIOD_LABELS[period]} · ${Number(d.count ?? 0).toLocaleString()}건`;
        }
    } catch (e) {
        console.error('Averages load failed:', e);
        if (summary && period === currentAvgPeriod) {
            summary.textContent = `${AVG_PERIOD_NAMES[period]} · 불러오기 실패`;
        }
    }
}

function setAvgPeriod(period, btn) {
    // 평균 카드의 기간 버튼 상태를 바꾸고 새 기간 기준으로 평균값을 다시 로드한다.

            b.classList.remove('active');

// ── History ───────────────────────────────────────────────
let historyPage    = 1;
let historyFilters = { date: '', time_from: '', time_to: '' };
let historyMeta    = { page: null, pages: null, total: null, per_page: null };

async function loadHistory(page = 1) {
    // 전체 기록 표는 페이지네이션과 날짜/시간 검색 조건을 서버에 넘겨 필요한 구간만 받는다.
    // device_id가 선택되어 있으면 같은 조건에 장치 필터도 함께 적용된다.
    historyPage = page;
    const params = new URLSearchParams({ page, per_page: 10 });
    if (SELECTED_DEVICE_ID) params.set('device_id', SELECTED_DEVICE_ID);
    if (historyFilters.date)      params.append('date',      historyFilters.date);
    if (historyFilters.time_from) params.append('time_from', historyFilters.time_from);
    if (historyFilters.time_to)   params.append('time_to',   historyFilters.time_to);

    try {
        const data = await fetchJson('history', `/api/dashboard/history?${params}`);
        if (data === undefined) return;
        historyPage = data.page;
        renderHistoryTable(data.items, data.page, data.per_page);

        const metaChanged =
            data.page !== historyMeta.page ||
            data.pages !== historyMeta.pages ||
            data.total !== historyMeta.total ||
            data.per_page !== historyMeta.per_page;
        if (metaChanged) {
            renderPagination(data.page, data.pages, data.total);
            document.getElementById('history-total').textContent = data.total;
            historyMeta = {
                page: data.page,
                pages: data.pages,
                total: data.total,
                per_page: data.per_page,
            };
        }
    } catch (e) {
        console.error('History load failed:', e);
    }
}

function renderHistoryTable(items, page, perPage) {
    // 서버가 내려준 현재 페이지 items를 HTML table row로 변환한다.
    // 시간 표시는 server_received_at을 우선해 ESP32 NTP 실패 시에도 서버 수신 시각을 보여준다.
    const tbody  = document.getElementById('history-tbody');
    const offset = (page - 1) * (perPage ?? 10);

    if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#475569;padding:28px;">해당 기록이 없습니다.</td></tr>`;
        return;
    }

    const val  = (row, key, alt) => row[key] ?? (alt ? row[alt] : null) ?? '—';
    const time = (row) => row.server_received_at ?? row.time ?? row.timestamp ?? '—';

    tbody.textContent = '';
    for (const [i, row] of items.entries()) {
        const tr = document.createElement('tr');
        appendTextCell(tr, offset + i + 1).style.color = '#475569';
        appendTextCell(tr, time(row));
        appendTextCell(tr, row.device_id ?? 'legacy');
        appendTextCell(tr, val(row, 'temperature'), 'temp-val');
        appendTextCell(tr, val(row, 'humidity'), 'hum-val');
        appendTextCell(tr, val(row, 'soil_moisture'), 'soil-val');
        appendTextCell(tr, val(row, 'light', 'light_digital'), 'light-val');
        tbody.appendChild(tr);
    }
}

function paginationMarkup(page, pages, total, loadPage) {
    // 호출 함수명은 아래 두 렌더러의 고정값이다. 사용자 입력은 받지 않는다.
    // 전체 페이지 수와 무관하게 첫/마지막 및 현재 주변 최대 7개만 순회한다.
    const btn = (label, p, active = false, disabled = false) =>
        `<button class="page-btn${active ? ' active' : ''}" ${disabled ? 'disabled' : ''}
            onclick="${disabled || active ? '' : `${loadPage}(${p})`}">${label}</button>`;

    let html = btn('‹', page - 1, false, page === 1);

    if (pages <= 1) {
        html += btn(1, 1, true);
    } else {
        const delta = 2;
        const visiblePages = new Set([1, pages]);
        for (let p = Math.max(1, page - delta); p <= Math.min(pages, page + delta); p++) {
            visiblePages.add(p);
        }
        let prev = -1;
        for (const p of [...visiblePages].sort((a, b) => a - b)) {
            if (prev !== -1 && p - prev > 1) html += `<span class="page-info">…</span>`;
            html += btn(p, p, p === page);
            prev = p;
        }
    }

    html += btn('›', page + 1, false, page === pages);
    html += `<span class="page-info">총 ${total}건</span>`;
    return html;
}

function renderPagination(page, pages, total) {
    document.getElementById('pagination').innerHTML =
        paginationMarkup(page, pages, total, 'loadHistory');
}

function searchHistory() {

function syncDeviceOptions(devices) {
    const select = document.getElementById('device-select');
    if (!select) return;

    const selected = SELECTED_DEVICE_ID || 'all';
    const values = ['all', ...devices];
    const currentValues = Array.from(select.options).map(option => option.value);
    if (
        currentValues.length === values.length &&
        currentValues.every((value, index) => value === values[index])
    ) {
        return;
    }

    select.innerHTML = '';
    const allOption = new Option('전체', 'all', false, selected === 'all');
    select.add(allOption);

    for (const device of devices) {
        const option = new Option(device, device, false, device === SELECTED_DEVICE_ID);
        select.add(option);
    }

    if (SELECTED_DEVICE_ID && !devices.includes(SELECTED_DEVICE_ID)) {
        select.add(new Option(SELECTED_DEVICE_ID, SELECTED_DEVICE_ID, false, true));
    }
}

async function refreshDeviceOptions() {
    try {
        const data = await fetchJson('devices', apiUrl('/api/dashboard/devices'));
        if (data === undefined) return;
        syncDeviceOptions(data.devices ?? []);
        applyDeviceLabels();
    } catch (e) {
        console.error('Device list refresh failed:', e);
    }
}

function applyDeviceLabels() {
    // 드롭다운의 표시 텍스트만 별칭으로 바꾼다.
    // option의 value는 그대로 device_id여야 기존 필터 링크가 모두 유지된다.
    const select = document.getElementById('device-select');
    if (!select || !_devices.length) return;
    const byId = new Map(_devices.map(d => [d.device_id, d.display_name]));
    for (const option of select.options) {
        if (option.value === 'all') continue;
        const label = byId.get(option.value);
        if (label) option.textContent = label;
    }
}

// ── 장치 온라인/오프라인 상태 ────────────────────────────
// ESP32가 죽거나 Wi-Fi가 끊기면 새 데이터가 안 올 뿐, 화면은 마지막 값을 계속 보여준다.
// 그래서 "마지막 수신이 얼마나 오래됐는지"를 서버에서 판정해 배지로 노출한다.

function formatAge(seconds) {
    if (seconds == null) return '';
    if (seconds < 60) return `${Math.round(seconds)}초 전`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}분 전`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}시간 전`;
    return `${Math.floor(seconds / 86400)}일 전`;
}

function renderDeviceStatusBadge(data) {
    const el = document.getElementById('device-status-badge');
    if (!el) return;

    // 전체 보기에서는 개별 장치가 아니라 "오프라인이 몇 대인지"가 중요한 정보다.
    if (!SELECTED_DEVICE_ID) {
        const offline = data?.offline_count ?? 0;
        const total = data?.devices?.length ?? 0;
        if (!total) {
            el.className = 'dev-badge dev-unknown';
            el.textContent = '장치 없음';
        } else if (offline > 0) {
            el.className = 'dev-badge dev-offline';
            el.textContent = `오프라인 ${offline}/${total}`;
        } else {
            el.className = 'dev-badge dev-online';
            el.textContent = `전체 온라인 (${total})`;
        }
        el.title = (data?.devices ?? [])
            .map(entry => `${entry.device_id}: ${entry.status} (${formatAge(entry.age_seconds) || '시각 불명'})`)
            .join('\n') || '장치 연결 상태';
        return;
    }

    const current = data?.current;
    if (!current || current.status === 'unknown') {
        el.className = 'dev-badge dev-unknown';
        el.textContent = current && current.total === 0 ? '수신 기록 없음' : '상태 불명';
        el.title = '마지막 수신 시각을 확인할 수 없습니다.';
        return;
    }

    const age = formatAge(current.age_seconds);
    if (current.status === 'offline') {
        el.className = 'dev-badge dev-offline';
        el.textContent = `오프라인 · ${age}`;
        el.title = `${current.offline_after_seconds}초 넘게 수신이 없습니다.`;
    } else {
        el.className = 'dev-badge dev-online';
        el.textContent = `온라인 · ${age}`;
        el.title = `마지막 수신: ${current.last_seen_at ?? '—'}`;
    }
}

async function refreshDeviceStatus() {
    try {
        const data = await fetchJson('device-status', apiUrl('/api/dashboard/device-status'));
        if (data === undefined) return;
        renderDeviceStatusBadge(data);
    } catch (e) {
        console.error('Device status refresh failed:', e);
    }
}

// ── 알림 기록 ─────────────────────────────────────────────
// alert_service가 event_log에 쌓아 온 이상/복구 기록을 화면에서 조회한다.
// 예전에는 Discord로 한 번 보내고 나면 서버 DB에만 남아 확인할 방법이 없었다.

let eventsPage   = 1;
let eventsStatus = '';
let eventsFilters = {
    metric: '', date_from: '', date_to: '', time_from: '', time_to: '',
};
let eventsMeta   = { page: null, pages: null, total: null, active: null };

function formatEventNumber(value) {
    if (value == null) return '—';
    const n = Number(value);
    if (!Number.isFinite(n)) return value;
    return Number.isInteger(n) ? n : Math.round(n * 100) / 100;
}

function renderEventsTable(items) {
    const tbody = document.getElementById('events-tbody');
    if (!tbody) return;

    if (!items.length) {
        renderEmptyTable('events-tbody', 6, '알림 기록이 없습니다.');
        return;
    }

    tbody.textContent = '';
    for (const row of items) {
        const tr = document.createElement('tr');
        appendTextCell(tr, row.created_at ?? '—');
        appendTextCell(tr, row.device_id ?? '—');
        appendTextCell(tr, row.metric_label ?? row.metric);

        // 상태는 배지로 표시해야 이상/복구가 표에서 한눈에 구분된다.
        const statusCell = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `event-status ${row.status === 'recovered'
            ? 'event-recovered' : row.severity === 'danger' ? 'event-danger' : 'event-abnormal'}`;
        badge.textContent = row.status === 'recovered'
            ? '복구' : `${row.severity === 'danger' ? '위험' : '경고'} · ${row.event_label}`;
        statusCell.appendChild(badge);
        tr.appendChild(statusCell);

        // 오프라인 이벤트는 측정값/범위 대신 경과 시간과 판정 기준을 보여준다.
        const isDevice = row.metric === 'device';
        const value = isDevice
            ? (row.value != null ? formatAge(row.value) : '—')
            : `${formatEventNumber(row.value)}${row.unit ?? ''}`;
        const range = isDevice
            ? (row.threshold_max != null ? `${formatEventNumber(row.threshold_max)}초 무응답 시` : '—')
            : (row.threshold_min != null && row.threshold_max != null
                ? `${formatEventNumber(row.threshold_min)} ~ ${formatEventNumber(row.threshold_max)}${row.unit ?? ''}`
                : '—');

        appendTextCell(tr, value, 'event-value');
        appendTextCell(tr, range, 'event-range');
        tbody.appendChild(tr);
    }
}

function renderEventsPagination(page, pages, total) {
    const el = document.getElementById('events-pagination');
    if (!el) return;

    let html = paginationMarkup(page, pages, total, 'loadEvents');
    html += `
        <form class="page-jump" onsubmit="jumpToEventsPage(event)">
            <label for="events-page-input">페이지</label>
            <input id="events-page-input" type="number" inputmode="numeric"
                   min="1" max="${pages}" step="1" value="${page}"
                   aria-label="이동할 알림 기록 페이지"
                   oninput="this.setCustomValidity('')">
            <span id="events-page-total">/ ${pages}</span>
            <button type="submit" class="page-btn">이동</button>
        </form>`;
    el.innerHTML = html;
}

function jumpToEventsPage(event) {
    event.preventDefault();
    const input = document.getElementById('events-page-input');
    if (!input) return;

    const targetPage = Number(input.value);
    const lastPage = Math.max(1, Number(eventsMeta.pages) || 1);
    if (!Number.isSafeInteger(targetPage) || targetPage < 1 || targetPage > lastPage) {
        input.setCustomValidity(`1부터 ${lastPage} 사이의 페이지를 입력하세요.`);
        input.reportValidity();
        input.select();
        return;
    }

    input.setCustomValidity('');
    loadEvents(targetPage);
}

function renderActiveAlertBadge(active) {
    const el = document.getElementById('events-active');
    if (!el) return;
    if (!active) {
        el.style.display = 'none';
        return;
    }
    el.style.display = '';
    el.textContent = `진행 중 ${active}건`;
}

async function loadEvents(page = 1) {
    eventsPage = page;
    const params = new URLSearchParams({ page, per_page: 10 });
    if (SELECTED_DEVICE_ID) params.set('device_id', SELECTED_DEVICE_ID);
    if (eventsStatus) params.set('status', eventsStatus);
    if (eventsFilters.metric) params.set('metric', eventsFilters.metric);
    if (eventsFilters.date_from) params.set('date_from', eventsFilters.date_from);
    if (eventsFilters.date_to) params.set('date_to', eventsFilters.date_to);
    if (eventsFilters.time_from) params.set('time_from', eventsFilters.time_from);
    if (eventsFilters.time_to) params.set('time_to', eventsFilters.time_to);

    try {
        const data = await fetchJson('events', `/api/dashboard/events?${params}`);
        if (data === undefined) return;

        eventsPage = data.page;
        renderEventsTable(data.items);

        // 히스토리 표와 같은 이유로, 메타 정보가 그대로면 페이지 버튼을 다시 그리지 않는다.
        // 폴링마다 버튼이 새로 만들어지면 클릭 중에 DOM이 교체되어 조작이 끊긴다.
        const metaChanged =
            data.page !== eventsMeta.page ||
            data.pages !== eventsMeta.pages ||
            data.total !== eventsMeta.total ||
            data.active !== eventsMeta.active;
        if (metaChanged) {
            renderEventsPagination(data.page, data.pages, data.total);
            document.getElementById('events-total').textContent = data.total;
            renderActiveAlertBadge(data.active);
            eventsMeta = {
                page: data.page, pages: data.pages,
                total: data.total, active: data.active,
            };
        }
    } catch (e) {
        console.error('Events load failed:', e);
    }
}

function setEventStatus(status, btn) {
    eventsStatus = status;
    document.querySelectorAll('#events-btn-all, #events-btn-abnormal, #events-btn-recovered')
        .forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // 필터가 바뀌면 페이지 수 자체가 달라지므로 메타 캐시를 비워 강제로 다시 그린다.
    eventsMeta = { page: null, pages: null, total: null, active: null };
    loadEvents(1);
}

function searchEvents() {
    const dateFrom = document.getElementById('events-filter-date-from').value;
    const dateTo = document.getElementById('events-filter-date-to').value;
    if (dateFrom && dateTo && dateFrom > dateTo) {
        alert('알림 기록 시작 날짜는 종료 날짜보다 늦을 수 없습니다.');
        return;
    }
    eventsFilters = {
        metric: document.getElementById('events-filter-metric').value,
        date_from: dateFrom,
        date_to: dateTo,
        time_from: document.getElementById('events-filter-from').value,
        time_to: document.getElementById('events-filter-to').value,
    };
    eventsMeta = { page: null, pages: null, total: null, active: null };
    loadEvents(1);
}

function clearEventFilters() {
    document.getElementById('events-filter-metric').value = '';
    document.getElementById('events-filter-date-from').value = '';
    document.getElementById('events-filter-date-to').value = '';
    document.getElementById('events-filter-from').value = '';
    document.getElementById('events-filter-to').value = '';
    eventsFilters = {
        metric: '', date_from: '', date_to: '', time_from: '', time_to: '',
    };
    eventsMeta = { page: null, pages: null, total: null, active: null };
    loadEvents(1);
}

function refreshVisibleEvents() {
    if (eventsPage === 1) loadEvents(1);
}

// ── 장치 관리 ─────────────────────────────────────────────
// 지금까지 장치는 "센서 데이터에 device_id가 등장했는가"로만 존재했다.
// 그래서 새 보드는 데이터를 보내기 전까지 화면에 없었고, esp32_01 같은
// 식별자만 보여 어느 온실의 어느 자리인지 알 수 없었다.

let _devices = [];

function openDeviceModal() {
    document.getElementById('device-modal').style.display = 'flex';
    showDeviceList();
}

function closeDeviceModal() {
    document.getElementById('device-modal').style.display = 'none';
}

function showDeviceList() {
    document.getElementById('device-modal-list-view').style.display = '';
    document.getElementById('device-modal-edit-view').style.display = 'none';
    loadDevices();
}

function renderDeviceList(devices) {
    const el = document.getElementById('device-modal-list');
    if (!el) return;
    if (!devices.length) {
        el.innerHTML = '<div style="color:#475569;font-size:0.84rem">등록된 장치도, 수신된 데이터도 없습니다.</div>';
        return;
    }

    el.textContent = '';
    for (const device of devices) {
        const row = document.createElement('div');
        row.className = 'device-row';

        const main = document.createElement('div');
        main.className = 'device-row-main';
        const name = document.createElement('div');
        name.className = 'device-row-name';
        name.textContent = device.label || device.device_id;
        main.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'device-row-meta';
        const parts = [device.device_id];
        if (device.location) parts.push(device.location);
        if (!device.has_data) parts.push('수신 기록 없음');
        meta.textContent = parts.join(' · ');
        main.appendChild(meta);
        row.appendChild(main);

        const tag = document.createElement('span');
        tag.className = `device-tag ${device.registered ? 'tag-registered' : 'tag-unknown'}`;
        tag.textContent = device.registered ? '등록됨' : '미등록';
        row.appendChild(tag);

        const actions = document.createElement('div');
        actions.className = 'crop-list-actions';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-ghost btn-xs';
        editBtn.textContent = device.registered ? '수정' : '등록';
        editBtn.onclick = () => showDeviceForm(device.device_id);
        actions.appendChild(editBtn);

        if (device.registered) {
            const delBtn = document.createElement('button');
            delBtn.className = 'btn btn-danger btn-xs';
            delBtn.textContent = '삭제';
            delBtn.onclick = () => confirmDeleteDevice(device.device_id);
            actions.appendChild(delBtn);
        }
        row.appendChild(actions);
        el.appendChild(row);
    }
}

async function loadDevices() {
    try {
        const data = await fetchJson('devices-manage', '/api/devices');
        if (data === undefined) return;
        _devices = data.devices ?? [];
        renderDeviceList(_devices);
    } catch (e) {
        console.error('Device list load failed:', e);
    }
}

function showDeviceForm(deviceId) {
    document.getElementById('device-modal-list-view').style.display = 'none';
    document.getElementById('device-modal-edit-view').style.display = '';

    const device = deviceId ? _devices.find(d => d.device_id === deviceId) : null;
    document.getElementById('device-form-title').textContent =
        device && device.registered ? '장치 수정' : '장치 등록';
    document.getElementById('device-form-msg').textContent = '';
    document.getElementById('device-form-msg').className = 'modal-msg';

    const idInput = document.getElementById('device-form-id');
    idInput.value = deviceId ?? '';
    // 이미 존재하는 장치의 ID는 바꾸지 못하게 한다.
    // ID를 바꾸면 그 장치의 센서 기록과 연결이 끊어지기 때문이다.
    idInput.disabled = Boolean(deviceId);

    document.getElementById('device-form-label').value = device?.label ?? '';
    document.getElementById('device-form-location').value = device?.location ?? '';
    document.getElementById('device-form-note').value = device?.note ?? '';
}

async function submitDeviceForm() {
    const msgEl = document.getElementById('device-form-msg');
    const deviceId = document.getElementById('device-form-id').value.trim();
    if (!deviceId) {
        msgEl.textContent = '장치 ID를 입력하세요.';
        msgEl.className = 'modal-msg error';
        return;
    }

    msgEl.textContent = '저장 중...';
    msgEl.className = 'modal-msg';
    try {
        const res = await fetch('/api/devices', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                device_id: deviceId,
                label: document.getElementById('device-form-label').value,
                location: document.getElementById('device-form-location').value,
                note: document.getElementById('device-form-note').value,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '저장에 실패했습니다.');

        msgEl.textContent = '저장되었습니다!';
        msgEl.className = 'modal-msg ok';
        setTimeout(showDeviceList, 700);
    } catch (e) {
        msgEl.textContent = e.message || '저장에 실패했습니다.';
        msgEl.className = 'modal-msg error';
    }
}

async function confirmDeleteDevice(deviceId) {
    if (!confirm(`'${deviceId}' 등록 정보를 삭제할까요?\n\n센서 기록은 삭제되지 않습니다.`)) return;
    const msgEl = document.getElementById('device-list-msg');
    try {
        const res = await fetch(`/api/devices/${encodeURIComponent(deviceId)}`,
                                { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '삭제에 실패했습니다.');
        msgEl.textContent = '삭제되었습니다.';
        msgEl.className = 'modal-msg ok';
        loadDevices();
    } catch (e) {
        msgEl.textContent = e.message || '삭제에 실패했습니다.';
        msgEl.className = 'modal-msg error';
    }
}

// ── 알림 설정 ─────────────────────────────────────────────
// 항목별 on/off, 재알림 간격, Webhook URL을 DB에 저장한다.
// 예전에는 코드 상수와 환경변수라 서버를 다시 띄워야만 바꿀 수 있었다.

let _alertFields = [];

function setAlertMessage(text, kind = '') {
    const el = document.getElementById('alert-settings-message');
    if (!el) return;
    el.textContent = text;
    el.className = `threshold-message${kind ? ` ${kind}` : ''}`;
}

function renderAlertToggles(fields, settings) {
    const el = document.getElementById('alert-toggle-list');
    if (!el) return;
    el.textContent = '';
    for (const field of fields) {
        const row = document.createElement('div');
        row.className = 'setting-row';

        const label = document.createElement('label');
        label.htmlFor = `alert-toggle-${field.key}`;
        label.textContent = field.label;
        row.appendChild(label);

        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = `alert-toggle-${field.key}`;
        input.checked = Boolean(settings[field.key]);
        row.appendChild(input);

        el.appendChild(row);
    }
}

async function loadAlertSettings() {
    const scope = document.getElementById('alert-settings-scope');
    if (scope) {
        scope.textContent = SELECTED_DEVICE_ID
            ? SELECTED_DEVICE_ID
            : '전체 기본값';
    }
    const resetBtn = document.getElementById('alert-reset-btn');
    // 전역 기본값에는 "기본값으로 되돌리기"가 의미가 없다.
    if (resetBtn) resetBtn.disabled = !SELECTED_DEVICE_ID;

    try {
        const url = SELECTED_DEVICE_ID
            ? `/api/alert-settings?device_id=${encodeURIComponent(SELECTED_DEVICE_ID)}`
            : '/api/alert-settings';
        const data = await fetchJson('alert-settings', url);
        if (data === undefined) return;

        _alertFields = data.fields ?? [];
        renderAlertToggles(_alertFields, data.settings ?? {});

        const cooldown = document.getElementById('alert-cooldown');
        if (cooldown) cooldown.value = data.settings?.cooldown_minutes ?? '';
        const settingValues = {
            'alert-abnormal-count': data.settings?.abnormal_count,
            'alert-duration': data.settings?.abnormal_duration_seconds,
            'alert-recovery-count': data.settings?.recovery_count,
            'alert-danger-percent': data.settings?.danger_deviation_percent,
            'alert-summary-hour': data.settings?.summary_hour,
            'alert-summary-weekday': data.settings?.summary_weekday,
        };
        for (const [id, value] of Object.entries(settingValues)) {
            const input = document.getElementById(id);
            if (input) input.value = value ?? '';
        }
        const booleanValues = {
            'alert-danger-immediate': data.settings?.danger_immediate,
            'alert-daily-summary': data.settings?.daily_summary,
            'alert-weekly-summary': data.settings?.weekly_summary,
        };
        for (const [id, value] of Object.entries(booleanValues)) {
            const input = document.getElementById(id);
            if (input) input.checked = Boolean(value);
        }
        const webhook = document.getElementById('alert-webhook');
        if (webhook) {
            webhook.value = '';
            webhook.placeholder = data.settings?.webhook_configured
                ? '기존 웹훅이 설정되어 있습니다 (변경할 때만 입력)'
                : '비우면 서버 환경변수를 사용합니다';
        }
        const clearWebhook = document.getElementById('alert-webhook-clear');
        if (clearWebhook) clearWebhook.checked = false;

        const sourceEl = document.getElementById('alert-settings-source');
        if (sourceEl) {
            const source = data.settings?.source;
            sourceEl.textContent =
                source === 'device' ? '이 장치만의 설정을 사용 중입니다.'
                : source === 'global' ? '전체 기본 설정을 따르고 있습니다.'
                : '아직 저장된 설정이 없어 기본 동작을 사용합니다.';
        }
        setAlertMessage('');
    } catch (e) {
        console.error('Alert settings load failed:', e);
        setAlertMessage('알림 설정을 불러오지 못했습니다.', 'error');
    }
}

async function saveAlertSettings() {
    const payload = {};
    if (SELECTED_DEVICE_ID) payload.device_id = SELECTED_DEVICE_ID;

    for (const field of _alertFields) {
        const input = document.getElementById(`alert-toggle-${field.key}`);
        if (input) payload[field.key] = input.checked;
    }

    const cooldownRaw = (document.getElementById('alert-cooldown')?.value ?? '').trim();
    // 빈 값은 "서버 기본값을 따른다"는 의미로 null을 보낸다.
    payload.cooldown_minutes = cooldownRaw === '' ? null : Number(cooldownRaw);
    if (cooldownRaw !== '' && Number.isNaN(payload.cooldown_minutes)) {
        setAlertMessage('재알림 간격은 숫자로 입력하세요.', 'error');
        return;
    }

    const numericSettings = {
        abnormal_count: 'alert-abnormal-count',
        abnormal_duration_seconds: 'alert-duration',
        recovery_count: 'alert-recovery-count',
        danger_deviation_percent: 'alert-danger-percent',
        summary_hour: 'alert-summary-hour',
        summary_weekday: 'alert-summary-weekday',
    };
    for (const [key, id] of Object.entries(numericSettings)) {
        const raw = (document.getElementById(id)?.value ?? '').trim();
        if (raw === '' || !Number.isFinite(Number(raw))) {
            setAlertMessage('알림 확인 조건과 요약 시간은 숫자로 입력하세요.', 'error');
            return;
        }
        payload[key] = Number(raw);
    }
    payload.danger_immediate = Boolean(document.getElementById('alert-danger-immediate')?.checked);
    payload.daily_summary = Boolean(document.getElementById('alert-daily-summary')?.checked);
    payload.weekly_summary = Boolean(document.getElementById('alert-weekly-summary')?.checked);

    const webhookValue = (document.getElementById('alert-webhook')?.value ?? '').trim();
    const clearWebhook = document.getElementById('alert-webhook-clear')?.checked;
    if (clearWebhook) payload.webhook_url = null;
    else if (webhookValue) payload.webhook_url = webhookValue;

    setAlertMessage('저장 중...');
    try {
        const res = await fetch('/api/alert-settings', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
            const detail = data.details
                ? Object.entries(data.details).map(([k, v]) => `${k}: ${v}`).join(', ')
                : data.error;
            throw new Error(detail || '저장에 실패했습니다.');
        }
        setAlertMessage('알림 설정을 저장했습니다.', 'ok');
        loadAlertSettings();
    } catch (e) {
        console.error('Alert settings save failed:', e);
        setAlertMessage(e.message || '저장에 실패했습니다.', 'error');
    }
}

async function resetAlertSettings() {
    if (!SELECTED_DEVICE_ID) return;
    if (!confirm(`${SELECTED_DEVICE_ID}의 개별 알림 설정을 지우고 전체 기본값을 따를까요?`)) return;
    try {
        const res = await fetch(
            `/api/alert-settings/${encodeURIComponent(SELECTED_DEVICE_ID)}`,
            { method: 'DELETE' });
        if (!res.ok && res.status !== 404) throw new Error('되돌리기에 실패했습니다.');
        setAlertMessage('전체 기본값을 따르도록 되돌렸습니다.', 'ok');
        loadAlertSettings();
    } catch (e) {
        setAlertMessage(e.message || '되돌리기에 실패했습니다.', 'error');
    }
}

// ── CSV 내보내기 ──────────────────────────────────────────
// 화면에서 보고 있는 조건을 그대로 붙여, 표에서 본 범위와 파일 내용이 일치하게 한다.

function downloadCsv(path, params) {
    const query = new URLSearchParams(params);
    if (SELECTED_DEVICE_ID) query.set('device_id', SELECTED_DEVICE_ID);
    // location.href를 쓰면 브라우저가 Content-Disposition을 보고 저장 대화상자를 연다.
    window.location.href = `${path}?${query.toString()}`;
}

        time_from: historyFilters.time_from || '',

// ── 저장 현황 / 보존 정책 ─────────────────────────────────
// 5초 주기 수집이면 하루 약 17,000행이 쌓인다. 현재 규모와 정리 수단을 함께 보여준다.

function formatBytes(bytes) {
    if (!bytes) return '—';
    const units = ['B', 'KB', 'MB', 'GB'];
    let value = bytes;
    let index = 0;
    while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index++;
    }
    return `${value.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
}

function setStorageMessage(text, kind = '') {
    const el = document.getElementById('storage-message');
    if (!el) return;
    el.textContent = text;
    el.className = `threshold-message${kind ? ` ${kind}` : ''}`;
}

async function loadStorageStats() {
    try {
        const data = await fetchJson('storage', '/api/maintenance/storage');
        if (data === undefined) return;

        const set = (id, text) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        };
        set('storage-raw', `${(data.raw_rows ?? 0).toLocaleString()}행`);
        set('storage-hourly', `${(data.hourly_rows ?? 0).toLocaleString()}행`);
        set('storage-size', formatBytes(data.database_bytes));
        set('storage-oldest', data.oldest_raw_at ?? '—');

        const policy = document.getElementById('storage-policy');
        if (policy) {
            policy.textContent =
                `원시 ${data.raw_retention_days}일 · 집계 ${data.hourly_retention_days}일 보관. ` +
                `정리는 집계가 끝난 구간만 삭제합니다.`;
        }
    } catch (e) {
        console.error('Storage stats load failed:', e);
    }
}

async function runRollup() {
    setStorageMessage('집계 중...');
    try {
        const res = await fetch('/api/maintenance/rollup', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '집계에 실패했습니다.');
        setStorageMessage(`시간별 집계 ${data.rolled_up_buckets}건을 갱신했습니다.`, 'ok');
        loadStorageStats();
    } catch (e) {
        setStorageMessage(e.message || '집계에 실패했습니다.', 'error');
    }
}

async function runRetention() {
    if (!confirm('보존 기간이 지난 원시 데이터를 삭제할까요?\n\n집계가 끝난 구간만 삭제되며 되돌릴 수 없습니다.')) {
        return;
    }
    setStorageMessage('정리 중...');
    try {
        const res = await fetch('/api/maintenance/retention', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '정리에 실패했습니다.');
        setStorageMessage(
            `원시 ${data.deleted_raw_rows}행 삭제 · 집계 ${data.rolled_up_buckets}건 갱신`, 'ok');
        loadStorageStats();
    } catch (e) {
        setStorageMessage(e.message || '정리에 실패했습니다.', 'error');
    }
}

// ── 인증 상태 표시 ────────────────────────────────────────
async function loadAuthStatus() {
    try {
        const data = await fetchJson('auth', '/api/auth/status');
        if (data === undefined) return;
        const chip = document.getElementById('auth-chip');
        if (chip && data.enabled) {
            chip.style.display = 'inline-flex';
            chip.classList.toggle('auth-needed', !data.authenticated);
            chip.textContent = data.authenticated ? '🔒 인증됨' : '🔓 로그인 필요';
            chip.title = data.authenticated
                ? '클릭하여 인증 상태 관리'
                : '클릭하여 API 키로 로그인';
        }
        if (data.enabled && !data.authenticated) openAuthModal();
        return !data.enabled || data.authenticated;
    } catch (e) {
        console.error('Auth status load failed:', e);
        return false;
    }
}

function openAuthModal() {
    const modal = document.getElementById('auth-modal');
    if (modal) modal.style.display = 'flex';
    setTimeout(() => document.getElementById('auth-key')?.focus(), 0);
}

function closeAuthModal() {
    const modal = document.getElementById('auth-modal');
    if (modal) modal.style.display = 'none';
}

async function submitAuthLogin() {
    const key = document.getElementById('auth-key')?.value ?? '';
    const message = document.getElementById('auth-message');
    if (message) message.textContent = '확인 중...';
    const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ api_key: key }),
    });
    const data = await response.json();
    if (!response.ok) {
        if (message) {
            message.textContent = data.error || 'API 키가 올바르지 않습니다.';
            message.className = 'modal-msg error';
        }
        return;
    }

    window.location.reload();
}

async function logoutAuth() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.reload();
}

async function refreshOnSensorChange() {
    const tasks = [
        refreshLatest(),
        loadAverages(currentAvgPeriod),
        loadCharts(currentChartPeriod),
        loadWateringEvents(),
        refreshDeviceOptions(),
        refreshDeviceStatus(),
    ];
    if (historyPage === 1) tasks.push(loadHistory(1));
    // 새 센서 row는 알림 상태 전이를 만들 수 있으므로 알림 기록도 함께 갱신한다.
    if (eventsPage === 1) tasks.push(loadEvents(1));
    await Promise.all(tasks);
}

let _lastMtime = null;

async function pollSensorChanges() {
    try {
        const data = await fetchJson('mtime', apiUrl('/api/dashboard/mtime'));
        if (data === undefined) return;

        const mtime = data.mtime ?? 0;
        if (_lastMtime === null) {
            _lastMtime = mtime;
            return;
        }
        if (mtime !== _lastMtime) {
            _lastMtime = mtime;
            await refreshOnSensorChange();
        }
    } catch (e) {
        console.error('Sensor change poll failed:', e);
    }
}

const REFRESH_MS = {
    change: 3000,
    latest: 5000,
    chart: 20000,
    averages: 30000,
    history: 30000,
    watering: 15000,
    events: 15000,
    // 오프라인 판정은 새 데이터가 "오지 않을 때" 바뀐다.
    // mtime 폴링은 변화가 없으면 아무 것도 갱신하지 않으므로 별도 주기가 필요하다.
    deviceStatus: 10000,
    // 저장 현황은 천천히 변하므로 드물게 확인한다.
    storage: 120000,
};

// ── Init ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    const authenticated = await loadAuthStatus();
    if (!authenticated) return;
    const workTime = document.getElementById('work-log-time');
    if (workTime && !workTime.value) {
        const localNow = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
        workTime.value = localNow.toISOString().slice(0, 16);
    }
    // 작물 프로필을 먼저 불러와 가이드 범위와 차트 기준선을 설정한 뒤,
    // 장치 임계값을 로드해 입력창을 채운다. 순서를 보장하기 위해 await를 사용한다.
    // 두 값이 모두 있어야 "작물 권장 범위와 임계값이 같은지" 비교 문구를 만들 수 있다.
    await loadActiveCrop();
    await loadThresholds(SELECTED_DEVICE_ID);
    updateThresholdSyncNote();

    refreshLatest();
    loadAverages(currentAvgPeriod);
    loadCharts(currentChartPeriod);
    loadGrowth();
    loadWateringEvents();
    loadWorkLogs();
    loadHistory(1);
    loadEvents(1);
    refreshDeviceOptions();
    refreshDeviceStatus();
    loadAlertSettings();
    loadStorageStats();
    // 장치 목록을 먼저 받아야 드롭다운에 별칭을 입힐 수 있다.
    loadDevices().then(applyDeviceLabels);
    pollSensorChanges();

    const visibleInterval = (callback, interval) => setInterval(() => {
        if (!document.hidden) callback();
    }, interval);
    visibleInterval(pollSensorChanges, REFRESH_MS.change);
    // 센서 기반 패널은 mtime이 바뀐 경우 refreshOnSensorChange()에서 한 번에
    // 갱신한다. 각각의 고정 주기 조회를 중복 실행하지 않는다.
    visibleInterval(refreshVisibleEvents, REFRESH_MS.events);
    visibleInterval(refreshDeviceStatus, REFRESH_MS.deviceStatus);
    visibleInterval(loadStorageStats, REFRESH_MS.storage);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            refreshOnSensorChange();
            refreshVisibleEvents();
            loadStorageStats();
        }
    });
});
</script>
