<style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-picker label {
            color: #94a3b8;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .device-picker select {
            min-width: 180px;
            padding: 6px 34px 6px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .device-picker select:hover { border-color: #4ade80; }

        .device-picker select:focus {
            outline: none;
            border-color: #4ade80;
        }

        /* ── Layout ── */
        .app-layout {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            max-width: 1560px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }

        .container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* ── Basil panel ── */
        .basil-panel {
            width: 264px;
            flex-shrink: 0;
            position: sticky;
            top: 76px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .basil-header {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guide-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 18px;
        }

        .guide-lbl {
            font-size: 0.68rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .guide-range {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .guide-current {
            font-size: 0.76rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        .guide-current b { color: #94a3b8; font-weight: 600; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .status-ok      { background: rgba(74,222,128,.15); color: #4ade80; border: 1px solid rgba(74,222,128,.3); }
        .status-warn    { background: rgba(251,191,36,.15);  color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
        .status-danger  { background: rgba(248,113,113,.15); color: #f87171; border: 1px solid rgba(248,113,113,.3); }
        .status-unknown { background: rgba(71,85,105,.2);    color: #64748b; border: 1px solid #334155; }

        .guide-bar-wrap { position: relative; height: 6px; background: #0f172a; border-radius: 3px; }

        .guide-bar-zone {
            position: absolute;
            top: 0; height: 100%;
            background: rgba(74,222,128,.35);
            border-radius: 3px;
        }

        .guide-bar-dot {
            position: absolute;
            top: 50%;
            width: 10px; height: 10px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            border: 2px solid #0f172a;
        }

        .guide-notes {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .guide-note { font-size: 0.73rem; color: #64748b; line-height: 1.45; }
        .guide-note b { color: #94a3b8; }

        @media (max-width: 1100px) {
            .app-layout { flex-direction: column; }
            .basil-panel { width: 100%; position: static; flex-direction: row; flex-wrap: wrap; }
            .basil-header { width: 100%; }
            .guide-card { flex: 1; min-width: 180px; }
            .guide-notes { width: 100%; }
        }

        section { display: flex; flex-direction: column; gap: 14px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            font-weight: 700;
        }

        .section-meta {
            margin-top: 4px;
            color: #475569;
            font-size: 0.68rem;
        }

        /* ── Toggle buttons ── */
        .toggle-group {
            display: flex;
            gap: 3px;
            background: #0f172a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .toggle-group button {
            padding: 5px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.15s;
        }

        .toggle-group button:hover { color: #cbd5e1; }

        .toggle-group button.active {
            background: #1e293b;
            color: #f1f5f9;
        }

        /* ── Sensor cards ── */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 22px;
        }

        .card .label { font-size: 0.78rem; color: #64748b; margin-bottom: 10px; font-weight: 600; }

        .card .value { font-size: 2rem; font-weight: 700; line-height: 1; }

        .card .unit { font-size: 0.95rem; font-weight: 400; color: #94a3b8; margin-left: 3px; }

        .card .sub { margin-top: 8px; font-size: 0.7rem; color: #475569; }

        .card.temp  .value { color: #f97316; }
        .card.hum   .value { color: #38bdf8; }
        .card.soil  .value { color: #4ade80; }
        .card.light .value { color: #facc15; }

        /* ── Charts ── */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        @media (max-width: 720px) {
            .chart-grid { grid-template-columns: 1fr; }
            header { padding: 0 16px; }
            .device-picker select { min-width: 132px; font-size: 0.75rem; }
        }

        .chart-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 20px 14px;
        }

        .chart-card-title {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 14px;
        }

        /* ── Growth and watering ── */
        .growth-grid {
            display: grid;
            grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
            gap: 14px;
        }

        .growth-form-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .growth-form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .growth-form-card .crop-form-field { min-width: 0; }
        .growth-form-card .crop-form-input,
        .growth-form-card .crop-form-textarea {
            width: 100%;
            min-width: 0;
        }
        .growth-form-card .crop-form-textarea { min-height: 72px; }

        .growth-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .growth-message {
            min-height: 1rem;
            color: #64748b;
            font-size: 0.76rem;
        }

        .growth-message.ok { color: #4ade80; }
        .growth-message.error { color: #f87171; }

        .growth-form-card :disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .table-wrap.compact-table-wrap {
            max-height: 290px;
            overflow: auto;
        }

        @media (max-width: 720px) {
            .growth-grid { grid-template-columns: 1fr; }
            .growth-form-row { grid-template-columns: 1fr; }
        }

        /* ── Table ── */
        .table-wrap {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }

        thead tr { background: #0f172a; }

        th {
            padding: 11px 14px;
            text-align: left;
            color: #64748b;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid #0f172a;
            color: #cbd5e1;
        }

        tbody tr:hover { background: #263347; }
        tbody tr:last-child td { border-bottom: none; }

        td.temp-val  { color: #f97316; font-weight: 600; }
        td.hum-val   { color: #38bdf8; font-weight: 600; }
        td.soil-val  { color: #4ade80; font-weight: 600; }
        td.light-val { color: #facc15; font-weight: 600; }

        /* ── No data ── */
        .no-data {
            background: #1e293b;
            border: 1px dashed #334155;
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            color: #475569;
            font-size: 0.9rem;
        }

        /* ── Filter bar ── */
        .history-filters {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .history-filters input[type="date"],
        .history-filters input[type="time"],
        .history-filters select {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 5px 10px;
            font-size: 0.78rem;
            transition: border-color 0.15s;
        }

        .history-filters input:focus { outline: none; border-color: #4ade80; }

        .event-filters { margin-bottom: 12px; }

        .history-filters .sep { color: #475569; font-size: 0.8rem; }

        .btn {
            padding: 5px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.15s;
        }

        .btn-primary { background: #4ade80; color: #0f172a; }
        .btn-primary:hover { background: #22c55e; }

        .btn-ghost { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        .btn-ghost:hover { color: #e2e8f0; border-color: #475569; }

        /* ── Threshold controls in guide panel ── */
        .threshold-device {
            font-size: 0.76rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .threshold-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .threshold-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .threshold-field label {
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .threshold-field input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 7px 9px;
            font-size: 0.82rem;
        }

        .threshold-field input:focus {
            outline: none;
            border-color: #4ade80;
        }

        .threshold-field input:disabled {
            color: #64748b;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .threshold-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .threshold-message {
            min-height: 1rem;
            font-size: 0.76rem;
            color: #64748b;
        }

        .threshold-message.ok { color: #4ade80; }
        .threshold-message.error { color: #f87171; }

        .soil-raw-value { margin-top: 6px; font-size: 0.72rem; color: #94a3b8; }
        .calibration-help { margin-top: 9px; font-size: 0.68rem; color: #64748b; line-height: 1.5; }
        .calibration-buttons { display: flex; gap: 6px; margin-top: 6px; }
        .calibration-buttons .btn { flex: 1; padding: 6px; font-size: 0.68rem; }

        /* ── Crop selector in panel header ── */
        .crop-select {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            flex: 1;
            min-width: 0;
        }
        .crop-select:hover { border-color: #334155; }
        .crop-select option { background: #1e293b; color: #e2e8f0; }

        .crop-header-label {
            color: #94a3b8;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .crop-mgr-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.15s;
            flex-shrink: 0;
        }
        .crop-mgr-btn:hover { color: #e2e8f0; }

        /* ── Crop management modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 480px;
            max-width: calc(100vw - 32px);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px 14px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        .modal-title {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.15s;
        }
        .modal-close-btn:hover { color: #e2e8f0; }

        .modal-back-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.82rem;
            padding: 4px 6px;
            border-radius: 4px;
            transition: color 0.15s;
        }
        .modal-back-btn:hover { color: #e2e8f0; }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }

        .modal-msg {
            font-size: 0.76rem;
            color: #64748b;
            margin-left: auto;
        }
        .modal-msg.ok    { color: #4ade80; }
        .modal-msg.error { color: #f87171; }

        /* Crop list in modal */
        .crop-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
        }

        .crop-list-name {
            flex: 1;
            font-size: 0.88rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .crop-list-actions { display: flex; gap: 6px; }

        .btn-xs { padding: 3px 10px; font-size: 0.72rem; }

        .btn-danger {
            background: rgba(248,113,113,.15);
            color: #f87171;
            border: 1px solid rgba(248,113,113,.3);
        }
        .btn-danger:hover { background: rgba(248,113,113,.25); }

        /* Crop edit form */
        .crop-form-field { display: flex; flex-direction: column; gap: 5px; }

        .crop-form-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .crop-form-input {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 7px 10px;
            font-size: 0.84rem;
        }
        .crop-form-input:focus { outline: none; border-color: #4ade80; }

        .crop-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .crop-form-textarea {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            padding: 8px 10px;
            font-size: 0.82rem;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .crop-form-textarea:focus { outline: none; border-color: #4ade80; }

        /* ── Device online/offline badge ── */
        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-right: 8px;
            vertical-align: middle;
        }

        .dev-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .dev-online  { background: rgba(74,222,128,.14); color: #4ade80; border: 1px solid rgba(74,222,128,.3); }
        .dev-offline { background: rgba(248,113,113,.14); color: #f87171; border: 1px solid rgba(248,113,113,.3); }
        .dev-unknown { background: rgba(71,85,105,.2);   color: #64748b; border: 1px solid #334155; }

        /* 오프라인일 때는 점이 깜빡여 화면을 잠깐 봐도 눈에 들어오게 한다. */
        .dev-offline::before { animation: dev-pulse 1.4s ease-in-out infinite; }

        @keyframes dev-pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.25; }
        }

        /* ── Event log ── */
        .event-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.66rem;
            font-weight: 700;
            background: rgba(248,113,113,.15);
            color: #f87171;
            border: 1px solid rgba(248,113,113,.3);
            text-transform: none;
            letter-spacing: 0;
        }

        .event-status {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .event-abnormal  { background: rgba(248,113,113,.15); color: #f87171; border: 1px solid rgba(248,113,113,.3); }
        .event-danger    { background: rgba(220,38,38,.28); color: #fecaca; border: 1px solid #dc2626; }
        .event-recovered { background: rgba(74,222,128,.15);  color: #4ade80; border: 1px solid rgba(74,222,128,.3); }

        td.event-range { color: #64748b; font-size: 0.78rem; white-space: nowrap; }
        td.event-value { font-weight: 600; color: #f1f5f9; white-space: nowrap; }

        /* ── Crop → threshold sync ── */
        .threshold-sync {
            margin-top: 8px;
            font-size: 0.7rem;
            line-height: 1.5;
            color: #64748b;
        }

        .threshold-sync.diff { color: #fbbf24; }
        .threshold-sync.same { color: #4ade80; }

        /* ── Header actions ── */
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .icon-btn {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 12px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .icon-btn:hover { color: #e2e8f0; border-color: #4ade80; }

        .auth-chip {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            background: rgba(74,222,128,.14);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,.3);
            cursor: pointer;
        }
        .auth-chip.auth-needed {
            background: rgba(251,191,36,.14);
            color: #fbbf24;
            border-color: rgba(251,191,36,.3);
        }

        /* ── Settings cards in side panel ── */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 0;
        }

        .setting-row label { font-size: 0.76rem; color: #94a3b8; cursor: pointer; }

        .setting-row input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #4ade80;
            cursor: pointer;
        }

        .setting-input {
            width: 100%;
            background: #0f172a;
