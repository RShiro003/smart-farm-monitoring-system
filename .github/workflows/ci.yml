name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_dashboard_js.cjs

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [esp32-real-sensor-node, esp32-dummy-node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install platformio
      - run: cp ${{ matrix.project }}/include/secrets.example.h ${{ matrix.project }}/include/secrets.h
      - run: pio run --project-dir ${{ matrix.project }}
